<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bé Học Nói Tiếng Anh</title>
<style>
/* Layout: one phone-sized column, big picture card, two big buttons (Nghe / Nói), result strip below. */
:root{
  --bg:#fff6e0; --card:#ffffff; --ink:#2b2a4c; --muted:#6d6a8c;
  --sun:#ffb703; --sky:#3a86ff; --leaf:#2ec27e; --berry:#ef476f; --line:#f0e2bd;
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1b33; --card:#2a2850; --ink:#fdf6e3; --muted:#b5b2d6; --line:#3d3a6b; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1b33; --card:#2a2850; --ink:#fdf6e3; --muted:#b5b2d6; --line:#3d3a6b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.45;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:800;font-size:1.5rem;margin:0;text-wrap:balance}
.total{font-family:var(--font-display);font-weight:800;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;white-space:nowrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.now{background:var(--sky);transform:scale(1.25)}
.dot.s1{background:#ffd166}.dot.s2{background:#ffb703}.dot.s3{background:var(--leaf)}
.card{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:22px 18px;text-align:center}
.pic{font-size:7rem;line-height:1.1}
.word{font-family:var(--font-display);font-weight:800;font-size:3rem;line-height:1.1;margin:4px 0 0}
.vi{color:var(--muted);font-weight:700;margin:2px 0 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;font-family:var(--font-display);font-weight:800;font-size:1.25rem;border:0;border-radius:20px;padding:16px 12px;cursor:pointer;color:#fff;min-height:64px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button:active{transform:translateY(2px)}
.listen{background:var(--sky)}
.speak{background:var(--berry)}
.speak.on{animation:pulse 1s infinite}
.next{background:var(--leaf);width:100%}
button[disabled]{opacity:.45;cursor:not-allowed}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--berry) 30%,transparent)}}
@media (prefers-reduced-motion:reduce){.speak.on{animation:none}}
.result{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px 18px;min-height:128px}
.stars{font-size:2.2rem;letter-spacing:4px}
.heard{color:var(--muted);margin:0}
.heard b{color:var(--ink)}
.msg{font-family:var(--font-display);font-weight:600;font-size:1.2rem;margin:4px 0 0}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.manual button{background:var(--sun);color:#2b2a4c;font-size:1rem;min-height:0;padding:12px 16px}
.note{color:var(--muted);font-size:.9rem;margin:0}
.final{text-align:center}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Bé Học Nói Tiếng Anh</h1>
    <div class="total" id="total" aria-live="polite">⭐ 0</div>
  </header>
  <div class="dots" id="dots" aria-hidden="true"></div>

  <section class="card" id="card">
    <div class="pic" id="pic"></div>
    <p class="word" id="word"></p>
    <p class="vi" id="vi"></p>
  </section>

  <div class="row">
    <button class="listen" id="btnListen">🔊 Nghe</button>
    <button class="speak" id="btnSpeak">🎤 Nói</button>
  </div>

  <section class="result" id="result" aria-live="polite">
    <p class="msg" id="msg">Bấm “Nghe” rồi bắt chước nhé!</p>
    <div class="stars" id="stars"></div>
    <p class="heard" id="heard"></p>
  </section>

  <form class="manual" id="manual" hidden>
    <input id="typed" placeholder="Gõ từ bé vừa đọc" autocomplete="off" autocapitalize="off" aria-label="Từ bé vừa đọc">
    <button type="submit">Chấm</button>
  </form>
  <p class="note" id="note"></p>

  <button class="next" id="btnNext" disabled>Từ tiếp theo ➜</button>
</main>

<script>
const WORDS=[
 {w:'apple',vi:'quả táo',e:'🍎'},{w:'cat',vi:'con mèo',e:'🐱'},{w:'dog',vi:'con chó',e:'🐶'},
 {w:'banana',vi:'quả chuối',e:'🍌'},{w:'book',vi:'quyển sách',e:'📘'},{w:'sun',vi:'mặt trời',e:'☀️'},
 {w:'water',vi:'nước',e:'💧'},{w:'hello',vi:'xin chào',e:'👋'},{w:'thank you',vi:'cảm ơn',e:'🙏'},{w:'fish',vi:'con cá',e:'🐟'}
];
const $=id=>document.getElementById(id);
let idx=0, scores=[], answered=false;

function norm(s){return s.toLowerCase().replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim()}
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);
  for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n]}
function score(target,heard){
  const t=norm(target),h=norm(heard); if(!h)return 0;
  if((' '+h+' ').includes(' '+t+' '))return 100;           // đọc đúng, kể cả khi có thêm từ khác
  let best=0;
  for(const part of [h,...h.split(' ')]){best=Math.max(best,Math.round(100*(1-lev(t,part)/Math.max(t.length,part.length))))}
  return best}
const starsOf=s=>s>=85?3:s>=60?2:s>=30?1:0;
const MSG=[ 'Chưa nghe rõ, mình thử lại nhé!','Gần được rồi, cố lên!','Giỏi lắm!','Tuyệt vời! Đọc chuẩn rồi!' ];

function render(){
  const it=WORDS[idx];
  $('pic').textContent=it.e; $('word').textContent=it.w; $('vi').textContent=it.vi;
  $('dots').innerHTML=WORDS.map((_,i)=>`<span class="dot ${i===idx?'now':''} ${scores[i]!=null?'s'+scores[i]:''}"></span>`).join('');
  $('total').textContent='⭐ '+scores.reduce((a,b)=>a+(b||0),0);
  $('stars').textContent=''; $('heard').textContent=''; $('msg').textContent='Bấm “Nghe” rồi bắt chước nhé!';
  $('btnNext').disabled=true; $('typed').value=''; answered=false;
  $('btnNext').textContent=idx===WORDS.length-1?'Xem kết quả 🎉':'Từ tiếp theo ➜';
}
function showResult(heard){
  const it=WORDS[idx], sc=score(it.w,heard), st=starsOf(sc);
  scores[idx]=Math.max(scores[idx]||0,st); answered=true;
  $('stars').textContent='★'.repeat(st)+'☆'.repeat(3-st);
  $('stars').style.color=st?'var(--sun)':'var(--muted)';
  $('msg').textContent=MSG[st];
  $('heard').innerHTML=`Máy nghe được: <b>${heard?heard.replace(/</g,'&lt;'):'(không nghe thấy gì)'}</b> · ${sc}/100`;
  $('total').textContent='⭐ '+scores.reduce((a,b)=>a+(b||0),0);
  $('btnNext').disabled=false;
  document.querySelectorAll('.dot')[idx].className='dot now s'+scores[idx];
}
const NP=()=>window.Capacitor&&window.Capacitor.Plugins||{};
function say(text){
  const T=NP().TextToSpeech;
  if(T){return T.speak({text,lang:'en-US',rate:0.8,pitch:1.1,volume:1}).catch(()=>fallbackSay(text))}
  fallbackSay(text)}
function fallbackSay(text){
  try{const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=0.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

$('btnListen').onclick=()=>say(WORDS[idx].w);
$('btnSpeak').onclick=async()=>{
  const R=NP().SpeechRecognition;
  if(!R){$('manual').hidden=false;$('typed').focus();return}
  try{
    const ok=await R.available();
    if(!ok.available){throw new Error('na')}
    let perm=await R.checkPermissions();
    if(perm.speechRecognition!=='granted'){perm=await R.requestPermissions()}
    if(perm.speechRecognition!=='granted'){$('note').textContent='Hãy cho phép micro trong Cài đặt rồi thử lại.';return}
    $('btnSpeak').classList.add('on');
    const r=await R.start({language:'en-US',maxResults:5,prompt:'Đọc: '+WORDS[idx].w,partialResults:false,popup:true});
    const matches=(r&&r.matches)||[];
    let best='',bs=-1;
    for(const m of matches){const sc=score(WORDS[idx].w,m);if(sc>bs){bs=sc;best=m}}
    showResult(best);
  }catch(e){
    $('msg').textContent='Chưa nghe thấy gì, thử lại nhé!';
    if(!R||String(e&&e.message).includes('na')){$('manual').hidden=false}
  }finally{$('btnSpeak').classList.remove('on')}
};
$('manual').onsubmit=e=>{e.preventDefault();showResult($('typed').value)};
$('btnNext').onclick=()=>{
  if(idx<WORDS.length-1){idx++;render();setTimeout(()=>say(WORDS[idx].w),250)}
  else finish()};
function finish(){
  const total=scores.reduce((a,b)=>a+(b||0),0), max=WORDS.length*3;
  document.querySelector('.app').innerHTML=`
   <header><h1>Bé Học Nói Tiếng Anh</h1></header>
   <section class="card final"><div class="pic">🏆</div>
   <p class="word">${total}/${max} ⭐</p>
   <p class="vi">Bé học xong ${WORDS.length} từ rồi!</p></section>
   <button class="next" onclick="location.reload()">Chơi lại</button>`}

render();
setTimeout(()=>{
  const ok=NP().SpeechRecognition;
  if(!ok){$('manual').hidden=false;$('note').textContent='Chạy trên trình duyệt: chưa có nhận giọng nói, nhập từ bé đọc vào ô gõ để chấm điểm.'}
},300);
</script>
</body>
</html>
